schema_version: task3.e0_prime.v1
experiment_id: task3_e0_prime_oracle_causal_graph_bridge
status: frozen_before_execution
purpose: >-
  Test whether the frozen Stage-3 graph-semantic solver benefits from the
  correctly aligned structure of natural-semantic directed causal DAGs.

frozen_stage3:
  source_entrypoint: v5/main.py
  source_task_runner: v5/run_task1.py
  adapter_entrypoint: task3_v2/scripts/run_e0_bridge.py
  semantic_encoder: intfloat/e5-large-v2
  semantic_encoder_snapshot_revision: f169b11e22de13617baa190a028a32f3493550b6
  calibrated_space:
    method: LoRA
    rank: 8
    alpha: 16
    wrapped_last_layers: 2
    checkpoint: v5/outputs/l3_lora.pt
    sha256: d90b024e7fb030e3ee1545c8d19606cf032cf810fc7f4a758749dfefc95a49d5
  decode_dictionary:
    path: v5/outputs/concept_bank_l3.npz
    sha256: 6da2de255dcb2fa559fa1c2a8bfba25fd0e4fcfecb5c768ecf229b6ce4e7bb9e
  semantic_negation:
    method: frozen_f_neg
    checkpoint: v5/outputs/negop.pt
    sha256: 6f30f0d68ee653d52aef93bdae97feeac8abd17189e688ef49f594e18574690e
  solver:
    arm: mlp
    module: WeightNet
    checkpoint: v5/outputs/l2_mlp.pt
    sha256: 70ffc4fcf668b57d943240fde67a8b339c702fa0093a5594f34e3297a5c50bfd
    unroll_steps: 60
    inner_optimizer: functional_adam
    inner_learning_rate: 0.02
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_epsilon: 1.0e-8
  objective:
    lam_zero: 0.3
    lam_norm: 0.1
    residual: 1.0
    lam_res: 1.0
    lam_dep: 0.0
    lam_coll: 0.0
    free_w: false
    bridge:
      measure: pearson
      lam_upper: 0.3
      kappa: 0.5
      q: 0.7
      dependence_matrix: train_dev_absolute_pearson_adapter
      test_used_for_estimation: false
    negation_operator: frozen_f_neg
    generative_operator: null
    latent_constraints: true
    latent_constraints_observed_only_effect: no_op
  training:
    artifact_training_commit: 70efde7ed488229667ae7958237116c7bdb40e45
    retrain_in_e0_prime: false
    lora_optimizer: frozen_from_checkpoint
    weightnet_optimizer: frozen_from_checkpoint
  baselines:
    uniform: v5/run_task1.py
    raw_correlation: v5/run_task1.py

graphs:
  - graph_id: graph_00
    world: industrial_cooling_system
    spec: graphs/industrial_cooling_system.json
    graph_seed: 3101
    data_seed: 9101
  - graph_id: graph_01
    world: logistics_and_delivery_system
    spec: graphs/logistics_and_delivery_system.json
    graph_seed: 3201
    data_seed: 9201
  - graph_id: graph_02
    world: water_treatment_system
    spec: graphs/water_treatment_system.json
    graph_seed: 3301
    data_seed: 9301

scm:
  form: linear_additive_gaussian
  coefficient_source: explicit_fixed_values_in_graph_specs
  samples_per_graph: 2000
  root_distribution:
    family: normal
    mean: 0.0
    standard_deviation: 1.0
  non_root_noise:
    family: normal
    mean: 0.0
    standard_deviation: 0.65
  coefficient_bounds: [0.4, 0.9]
  require_positive_coefficients: true
  standardization:
    method: zscore
    fit_split: train
    applied_to: [train, dev, test]
  split:
    train: 1200
    dev: 400
    test: 400
    shuffle_before_split: false
  edge_weight_estimation:
    implementation: v5.graph.Graph.estimate_weights
    fit_splits: [train, dev]
    test_used_for_selection: false

masking:
  fraction: 0.2
  folds: 5
  masked_nodes_per_fold: 4
  assignments:
    graph_00:
      - [node_000, node_007, node_012, node_018]
      - [node_001, node_008, node_013, node_019]
      - [node_002, node_009, node_014, node_015]
      - [node_003, node_005, node_010, node_016]
      - [node_004, node_006, node_011, node_017]
    graph_01:
      - [node_000, node_006, node_013, node_019]
      - [node_001, node_007, node_014, node_017]
      - [node_002, node_008, node_012, node_018]
      - [node_003, node_009, node_015, node_016]
      - [node_004, node_005, node_010, node_011]
    graph_02:
      - [node_000, node_008, node_014, node_019]
      - [node_001, node_009, node_015, node_017]
      - [node_002, node_010, node_013, node_018]
      - [node_003, node_006, node_012, node_016]
      - [node_004, node_005, node_007, node_011]

arms:
  - core_oracle_estimated_weights
  - core_oracle_true_weights
  - core_shuffled_graph
  - core_reversed_graph
  - raw_correlation
  - uniform

shuffle_null:
  permutations_per_graph: 20
  permutation_seeds:
    graph_00: [74101, 74102, 74103, 74104, 74105, 74106, 74107, 74108, 74109, 74110,
               74111, 74112, 74113, 74114, 74115, 74116, 74117, 74118, 74119, 74120]
    graph_01: [74201, 74202, 74203, 74204, 74205, 74206, 74207, 74208, 74209, 74210,
               74211, 74212, 74213, 74214, 74215, 74216, 74217, 74218, 74219, 74220]
    graph_02: [74301, 74302, 74303, 74304, 74305, 74306, 74307, 74308, 74309, 74310,
               74311, 74312, 74313, 74314, 74315, 74316, 74317, 74318, 74319, 74320]
  convention: >-
    permutation[i] is the new index of old node i; every old edge i->j is
    relabeled permutation[i]->permutation[j], exactly A_shuffle=P^T A P
    for P[old,new]=1.

evaluation:
  label_candidate_set: all_20_gold_label_embeddings_within_graph
  decoder: frozen_stage3_splice
  decoder_screen_k: 2000
  decoder_top_k: 6
  decoder_target_l0: 8
  decoder_alpha_fit: visible_labels_only_per_fold
  metrics:
    - judge_acc
    - match_acc
    - gold_embedding_cosine
    - mrr
    - recall_at_1
    - recall_at_5
    - exact_decode
  judge:
    mode: requests_only
    model: gpt-5.5
    fabricated_results_forbidden: true

bootstrap:
  hierarchy: [graph, fold, masked_node]
  draws: 10000
  seed: 88173
  confidence_level: 0.95
  comparisons:
    oracle_vs_shuffle: core_oracle_estimated_weights-minus-mean_core_shuffled_graph
    oracle_vs_reverse: core_oracle_estimated_weights-minus-core_reversed_graph
    oracle_vs_no_graph: core_oracle_estimated_weights-minus-uniform
    oracle_vs_rawcorr: core_oracle_estimated_weights-minus-raw_correlation

execution:
  torch_threads: 4
  deterministic_seed: 20260727
  save_predictions: false
  overwrite_results: true
